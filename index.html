<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnLaZona</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <div id="loading-screen">
        <div class="loader-container">
            <div class="loader"></div>
            <p id="loading-text">Cargando contenido...</p>
        </div>
    </div>

    <header id="barra-superior">
        <div class="container">
            <h1 class="main-title">EnLaZona</h1> </div>
    </header>

    <div id="contenido-principal" class="container">

        <section id="promo-gallery-container">
            <div id="promo-gallery"></div>
            <p id="loading-promos">Cargando promociones...</p>
        </section>

        <div id="filtros-container">
            <div class="filter-bar">
                <div class="search-wrapper">
                    <span class="material-symbols-outlined">search</span>
                    <input type="text" id="buscador-input" placeholder="Buscar por nombre o etiqueta...">
                </div>
                <div class="category-select-wrapper">
                    <select id="categorias-select">
                        <option value="Todos">Cargando...</option>
                    </select>
                </div>
                <div class="distance-slider-wrapper" id="distance-slider-ui">
                    <label for="distance-filter">
                        Distancia máx: <span id="distance-value">15</span> km
                    </label>
                    <input type="range" id="distance-filter" min="1" max="50" value="15">
                </div>
                <p id="location-message" class="hidden location-info-text">Activa la ubicación para buscar por distancia</p>
            </div>
        </div>

        <div id="data-list">
            <p id="loading-message">Obteniendo ubicación y cargando lugares...</p>
            <p id="error-message" class="hidden"></p>
            <p id="no-results-message" class="hidden">No se encontraron lugares que coincidan con los filtros.</p>
        </div>
    </div>

    <script>
        // --- ESTADO GLOBAL ---
        let allData = [];
        let allPromos = [];
        let userLat = undefined;
        let userLon = undefined;
        let locationErrorOccurred = false;
        let filtroCategoriaSeleccionada = 'Todos';
        let maxDistance = 15; // Default distance
        let searchTerm = '';
        let promoIntervalId = null;
        let currentPromoIndex = -1;

        // --- ELEMENTOS DOM ---
        const distanceFilter = document.getElementById('distance-filter');
        const distanceValueSpan = document.getElementById('distance-value');
        const filtroCategoriasSelect = document.getElementById('categorias-select');
        const buscadorInput = document.getElementById('buscador-input');
        const dataListDiv = document.getElementById('data-list');
        const loadingMessage = document.getElementById('loading-message');
        const errorMessage = document.getElementById('error-message');
        const noResultsMessage = document.getElementById('no-results-message');
        const promoGalleryDiv = document.getElementById('promo-gallery');
        const loadingPromos = document.getElementById('loading-promos');
        const distanceSliderUI = document.getElementById('distance-slider-ui');
        const locationMessage = document.getElementById('location-message');
        const loadingScreen = document.getElementById('loading-screen');
        const mainContent = document.getElementById('contenido-principal');


        // --- INICIALIZACIÓN PRINCIPAL ---
        async function init() {
            // Configurar listeners primero
            setupEventListeners();

            try {
                console.log("Iniciando carga de datos...");
                // 1. Cargar datos JSON
                const [dataResponse, promosResponse] = await Promise.all([
                    fetch('data.json').catch(err => { console.error("Error fetch data.json:", err); return { ok: false, statusText: err.message }; }), // Añadir catch individual
                    fetch('promos.json').catch(err => { console.error("Error fetch promos.json:", err); return { ok: false, statusText: err.message }; }) // Añadir catch individual
                ]);

                // Validar respuestas
                if (!dataResponse.ok) throw new Error(`Error al cargar data.json: ${dataResponse.statusText}`);
                allData = await dataResponse.json(); // Solo parsear si la respuesta es OK

                if (!promosResponse.ok) {
                    console.warn(`Advertencia al cargar promos.json: ${promosResponse.statusText}. La galería no funcionará.`);
                    allPromos = []; // Asignar array vacío si falla
                } else {
                    allPromos = await promosResponse.json();
                }

                console.log("Datos JSON cargados:", allData.length, "lugares,", allPromos.length, "promos.");

                // 2. Poblar filtros y galería ahora que hay datos
                populateCategoryFilter();
                startPromoGallery();

                // 3. Intentar obtener ubicación (espera a que termine el intento)
                console.log("Intentando obtener ubicación...");
                await requestLocationAndFilter(); // Llama a filterAndDisplay internamente
                console.log("Intento de ubicación completado.");

                // 4. TODO LISTO: Ocultar pantalla de carga y mostrar contenido
                hideLoadingScreenAndShowContent();

            } catch (error) {
                console.error("Error fatal durante la inicialización:", error);
                showError(`No se pudo iniciar la aplicación: ${error.message}. Intenta recargar.`);
                hideLoadingScreenAndShowContent(); // Ocultar loading incluso con error
                distanceSliderUI?.classList.add('hidden');
                locationMessage?.classList.add('hidden');
            }
        }

        // --- OCULTAR LOADING SCREEN Y MOSTRAR CONTENIDO ---
        function hideLoadingScreenAndShowContent() {
            if (loadingScreen) {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500); // Coincide con transición CSS
            }
            if (mainContent) {
                mainContent.classList.add('visible');
            }
            console.log("Pantalla de carga oculta, contenido principal mostrado.");
        }


        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            // Listener para el slider de distancia
            distanceFilter.addEventListener('input', function() {
                maxDistance = parseInt(this.value);
                distanceValueSpan.textContent = maxDistance;
                // Solo filtra si la ubicación se obtuvo (slider visible)
                if (!locationErrorOccurred) {
                    filterAndDisplay();
                }
            });
            // Listener para el select de categorías
            filtroCategoriasSelect.addEventListener('change', () => {
                filtroCategoriaSeleccionada = filtroCategoriasSelect.value;
                filterAndDisplay();
            });
            // Listener para el input de búsqueda con debounce
            let debounceTimer;
            buscadorInput.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    searchTerm = buscadorInput.value.toLowerCase().trim();
                    filterAndDisplay();
                }, 300); // 300ms debounce
            });
        }

        // --- GALERÍA DE PROMOCIONES ---
        function startPromoGallery() {
             if (allPromos && allPromos.length > 0) {
                 loadingPromos.classList.add('hidden');
                 showNextPromo(); // Muestra la primera inmediatamente
                 if (promoIntervalId) clearInterval(promoIntervalId);
                 promoIntervalId = setInterval(showNextPromo, 5000);
             } else {
                 loadingPromos.textContent = 'No hay promociones disponibles.';
             }
         }
        function showNextPromo() {
             if (!allPromos || allPromos.length === 0) return;
             let randomIndex;
              do {
                  randomIndex = Math.floor(Math.random() * allPromos.length);
              } while (allPromos.length > 1 && randomIndex === currentPromoIndex);
              currentPromoIndex = randomIndex;
             const promo = allPromos[currentPromoIndex];
             const promoLink = document.createElement('a');
             promoLink.href = promo.link || '#';
             promoLink.target = "_blank";
             promoLink.rel = "noopener noreferrer";
             promoLink.className = 'promo-item'; // Opacity 0 via CSS transition
             const placeholderPromoImg = `https://placehold.co/800x400/dddddd/aaaaaa?text=Promo`;
              promoLink.innerHTML = `<img src="${promo.foto}" alt="Promoción ${promo.name || ''}" onerror="this.onerror=null; this.src='${placeholderPromoImg}';">`;

             const currentVisibleItem = promoGalleryDiv.querySelector('.promo-item.visible');
             if (currentVisibleItem) {
                 currentVisibleItem.classList.remove('visible');
                 setTimeout(() => {
                     if (currentVisibleItem && currentVisibleItem.parentNode === promoGalleryDiv) { // Check again if still exists
                          promoGalleryDiv.removeChild(currentVisibleItem);
                      }
                  }, 500); // Match transition duration
              }
             promoGalleryDiv.appendChild(promoLink);
             // Force reflow might not be needed, use small timeout
             setTimeout(() => {
                  promoLink.classList.add('visible');
              }, 10); // Small delay before fade-in
         }

        // --- FILTRO CATEGORÍAS ---
        function populateCategoryFilter() {
            const categorias = ['Todos', ...new Set(allData.map(item => item.categoria).filter(Boolean))];
             filtroCategoriasSelect.innerHTML = '';
             categorias.forEach(categoria => {
                 const option = document.createElement('option');
                 option.value = categoria;
                 option.textContent = categoria;
                 filtroCategoriasSelect.appendChild(option);
             });
        }

        // --- GEOLOCALIZACIÓN Y FILTRADO INICIAL ---
        function requestLocationAndFilter() {
            return new Promise((resolve) => {
                distanceSliderUI.classList.add('hidden');
                locationMessage.classList.add('hidden');
                loadingMessage.textContent = "Obteniendo ubicación..."; // Update loading text

                if (navigator.geolocation && navigator.geolocation.getCurrentPosition) {
                    console.log("Solicitando ubicación...");
                    navigator.geolocation.getCurrentPosition(
                        (position) => { handleLocationSuccess(position); resolve(); },
                        (error) => { handleLocationError(error); resolve(); },
                        { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
                    );
                } else {
                    console.log('Geolocalización no compatible.');
                    handleLocationError({ code: -1, message: 'Geolocalización no compatible.' });
                    resolve();
                }
            });
        }
        function handleLocationSuccess(position) {
             userLat = position.coords.latitude;
             userLon = position.coords.longitude;
             locationErrorOccurred = false;
             console.log(`Ubicación obtenida: ${userLat}, ${userLon}`);
             distanceSliderUI.classList.remove('hidden');
             locationMessage.classList.add('hidden');
             loadingMessage.textContent = "Cargando lugares..."; // Update loading text again
             filterAndDisplay(); // Muestra los datos iniciales filtrados
        }
        function handleLocationError(error) {
             console.warn('Error al obtener ubicación:', error.message, `(Código: ${error.code})`);
             userLat = undefined;
             userLon = undefined;
             locationErrorOccurred = true;
             distanceSliderUI.classList.add('hidden');
             locationMessage.classList.remove('hidden');
              if (error.code === 1) { // PERMISSION_DENIED
                 // No mostramos error rojo aquí, el mensaje amarillo es suficiente
                 // showError('Permiso de ubicación denegado. Actívalo para buscar por distancia.');
                 console.warn('Permiso de ubicación denegado.');
             } else {
                 console.log("Mostrando lugares sin filtro de distancia.");
             }
             loadingMessage.textContent = "Cargando lugares..."; // Update loading text again
             filterAndDisplay(); // Muestra los datos iniciales sin filtro de distancia
        }

        // --- CÁLCULO DISTANCIA (Haversine) ---
        function calculateDistance(lat1, lon1, lat2, lon2) {
             if (userLat === undefined || userLon === undefined || lat2 === undefined || lon2 === undefined || lat2 === null || lon2 === null) {
                 return Infinity;
             }
             const R = 6371; // Radio de la Tierra en km
             const dLat = deg2rad(lat2 - lat1);
             const dLon = deg2rad(lon2 - lon1);
             const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
             const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
             return R * c; // Distancia en km
         }
         function deg2rad(deg) { return deg * (Math.PI / 180); }


        // --- FUNCIÓN AUXILIAR PARA BARAJAR UN ARRAY (Fisher-Yates Shuffle) ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]]; // Swap elements
            }
            return array;
        }

        // --- FILTRADO Y VISUALIZACIÓN (CON ORDEN ALEATORIO) ---
        function filterAndDisplay() {
            if (!allData) {
                console.warn("Intentando filtrar pero allData no está listo.");
                loadingMessage.textContent = "Error: Datos no disponibles."; // Show error if data missing
                return;
            }
            hideMessages();
            loadingMessage.classList.remove('hidden'); // Show loading message during filtering
            loadingMessage.textContent = "Filtrando y ordenando...";
            dataListDiv.innerHTML = ''; // Clear previous results

            // Use setTimeout to allow UI update (show loading) before heavy work
            setTimeout(() => {
                try { // Add try-catch around filtering/shuffling
                    // 1. Filter data
                    let filteredData = allData.filter(item => {
                        let distanciaCumple = true;
                        if (!locationErrorOccurred) {
                            const distancia = calculateDistance(userLat, userLon, item.latitud, item.longitud);
                            distanciaCumple = (distancia <= maxDistance);
                        }
                        const categoriaCoincide = (filtroCategoriaSeleccionada === 'Todos') || (item.categoria === filtroCategoriaSeleccionada);
                        const busquedaCoincide = (searchTerm === '') ||
                            (item.name && item.name.toLowerCase().includes(searchTerm)) ||
                            (item.etiquetas && Array.isArray(item.etiquetas) && item.etiquetas.some(et => et.toLowerCase().includes(searchTerm)));
                        return distanciaCumple && categoriaCoincide && busquedaCoincide;
                    });

                    // 2. --- ORDENAMIENTO ELIMINADO ---

                    // 3. Shuffle the filtered data
                    console.log(`Filtrados ${filteredData.length} items. Barajando...`);
                    filteredData = shuffleArray(filteredData); // Apply shuffle

                    // 4. Render the shuffled data
                    renderData(filteredData);

                } catch (renderError) {
                    console.error("Error durante el filtrado o renderizado:", renderError);
                    showError("Ocurrió un error al mostrar los lugares.");
                    loadingMessage.classList.add('hidden'); // Hide loading on error
                }

            }, 10); // Small delay
        }

        // --- RENDERIZADO DATOS ---
        function renderData(items) {
            // dataListDiv.innerHTML = ''; // Clear moved to filterAndDisplay start

             if (items.length > 0) {
                 items.forEach((item, index) => {
                     try { // Add try-catch per item in case one item has bad data
                         const itemDiv = document.createElement('div');
                         itemDiv.className = 'data-card';
                         itemDiv.style.animationDelay = `${index * 0.06}s`; // Stagger animation

                         let distanciaTexto = '';
                         if (!locationErrorOccurred) {
                             const distanciaKm = calculateDistance(userLat, userLon, item.latitud, item.longitud);
                             if (isFinite(distanciaKm)) {
                                distanciaTexto = ` (~${distanciaKm.toFixed(1)} km)`;
                             }
                         }

                         const placeholderImg = `https://placehold.co/300x200/eeeeee/cccccc?text=Imagen+no+disponible`;

                         itemDiv.innerHTML = `
                             <img src="${item.imagen || placeholderImg}" alt="${item.name || 'Lugar'}" class="card-image" onerror="this.onerror=null; this.src='${placeholderImg}';">
                             <div class="card-content">
                                 <h3 class="card-title">${item.name || 'Nombre no disponible'}</h3>
                                 <p class="card-category">${item.categoria || 'Categoría no disponible'}<span class="card-distance">${distanciaTexto}</span></p>
                                 <p class="card-description">${item.descripcion || 'Descripción no disponible.'}</p>
                                 ${item.etiquetas && Array.isArray(item.etiquetas) && item.etiquetas.length > 0
                                     ? `<div class="card-tags">${item.etiquetas.map(tag => `<span class="card-tag">${tag}</span>`).join('')}</div>`
                                     : ''
                                 }
                             </div>
                         `;

                         // Event listener para navegar a detalles.html
                         itemDiv.addEventListener('click', () => {
                            try { // Add try-catch for navigation parameters
                                const params = new URLSearchParams();
                                for (const key in item) {
                                    if (Object.hasOwnProperty.call(item, key) && item[key] !== undefined && item[key] !== null) {
                                        const value = Array.isArray(item[key]) ? item[key].join(',') : String(item[key]); // Ensure string conversion
                                        params.append(key, value);
                                    }
                                }
                                // Ensure coordinates exist, even if empty, for details page robustness
                                if (!params.has('latitud')) params.append('latitud', '');
                                if (!params.has('longitud')) params.append('longitud', '');

                                const urlDestino = `detalles.html?${params.toString()}`;
                                console.log("Navegando a:", urlDestino);
                                window.location.href = urlDestino;
                            } catch (navError) {
                                console.error("Error al preparar navegación a detalles:", navError, "Item data:", item);
                                alert("No se pudo abrir el detalle para este lugar."); // User feedback
                            }
                         });

                         dataListDiv.appendChild(itemDiv); // Add card to grid
                     } catch (itemError) {
                         console.error("Error al renderizar item:", item, itemError);
                         // Optionally skip rendering this specific item or show a placeholder error card
                     }
                 });
              } else {
                  // Show "No results" only if initial data load was successful (allData exists)
                  if (allData && allData.length >= 0) {
                      showNoResults();
                  }
             }
             // Hide loading message AFTER rendering or showing "no results"
             loadingMessage.classList.add('hidden');
        }

        // --- MENSAJES ---
        function showError(message) {
             errorMessage.textContent = message;
              errorMessage.classList.remove('hidden');
              loadingMessage.classList.add('hidden'); // Ensure loading is hidden on error
              noResultsMessage.classList.add('hidden');
        }
        function showNoResults() {
             noResultsMessage.classList.remove('hidden');
              loadingMessage.classList.add('hidden');
              errorMessage.classList.add('hidden');
        }
        function hideMessages() {
             errorMessage.classList.add('hidden');
              noResultsMessage.classList.add('hidden');
              // Do not hide loadingMessage here, it's managed by filter/render functions
        }

        // --- INICIAR ---
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
