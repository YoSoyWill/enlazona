<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnLaZona</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="loading-screen">
        <div class="loader-container">
            <div class="loader"></div>
            <p id="loading-text">Cargando contenido...</p>
        </div>
    </div>

    <header id="barra-superior">
        <div class="container">
            <h1 class="main-title">EnLaZona</h1>
        </div>
    </header>

    <div id="contenido-principal" class="container" role="main">

        <section id="promo-gallery-container" aria-labelledby="promo-heading">
             <h2 id="promo-heading" class="hidden">Promociones Destacadas</h2>
             <div id="promo-gallery"></div>
             <p id="loading-promos">Cargando promociones...</p>
        </section>

        <section id="filtros-container" role="region" aria-labelledby="filter-heading-accordion">
            <button class="filtro-accordion-header" id="accordion-toggle-button" aria-expanded="true" aria-controls="filtro-accordion-content-id">
                <h2 id="filter-heading-accordion">Filtros de Búsqueda</h2>
                <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
            </button>

            <div class="filtro-accordion-content" id="filtro-accordion-content-id" role="region">
                <div class="filter-bar">
                    <div class="search-wrapper">
                        <label for="buscador-input" class="hidden">Buscar por nombre o etiqueta</label>
                        <span class="material-symbols-outlined" aria-hidden="true">search</span>
                        <input type="search" id="buscador-input" placeholder="Buscar por nombre o etiqueta...">
                    </div>
                    <div class="category-select-wrapper">
                         <label for="categorias-select" class="hidden">Filtrar por categoría</label>
                         <select id="categorias-select" aria-label="Seleccionar categoría">
                            <option value="Todos">Cargando...</option>
                        </select>
                    </div>
                    <div class="distance-slider-wrapper hidden" id="distance-slider-ui">
                        <label for="distance-filter">
                            Distancia máx: <span id="distance-value">15</span> km
                        </label>
                        <input type="range" id="distance-filter" min="1" max="50" value="15" aria-label="Ajustar distancia máxima">
                    </div>
                    <p id="location-message" class="hidden location-info-text" role="alert">Activa la ubicación para buscar por distancia</p>
                </div>
                 <div class="favorites-filter-wrapper">
                    <input type="checkbox" id="favoritos-filter" aria-label="Mostrar solo favoritos">
                    <label for="favoritos-filter">Mostrar solo favoritos</label>
                </div>
            </div>
        </section>

        <section id="data-list-container" aria-live="polite" aria-atomic="true">
             <h2 id="results-heading" class="hidden">Resultados de Lugares</h2>
             <div id="data-list">
                <p id="loading-message" role="status">Obteniendo ubicación y cargando lugares...</p>
                <p id="error-message" class="hidden" role="alert"></p>
                <p id="no-results-message" class="hidden" role="status"></p>
            </div>
        </section>
    </div>

    <script>
        // --- ESTADO GLOBAL ---
        let allData = [];
        let allPromos = [];
        let userLat = undefined;
        let userLon = undefined;
        let locationErrorOccurred = false;
        let filtroCategoriaSeleccionada = 'Todos';
        let maxDistance = 15;
        let searchTerm = '';
        let mostrarSoloFavoritos = false; // NUEVO: Estado para filtro de favoritos
        let promoIntervalId = null;
        let currentPromoIndex = -1;
        let favoritos = []; // Array para IDs (nombres) de favoritos

        // --- ELEMENTOS DOM ---
        const distanceFilter = document.getElementById('distance-filter');
        const distanceValueSpan = document.getElementById('distance-value');
        const filtroCategoriasSelect = document.getElementById('categorias-select');
        const buscadorInput = document.getElementById('buscador-input');
        const dataListDiv = document.getElementById('data-list');
        const loadingMessage = document.getElementById('loading-message');
        const errorMessage = document.getElementById('error-message');
        const noResultsMessage = document.getElementById('no-results-message');
        const promoGalleryDiv = document.getElementById('promo-gallery');
        const loadingPromos = document.getElementById('loading-promos');
        const distanceSliderUI = document.getElementById('distance-slider-ui');
        const locationMessage = document.getElementById('location-message');
        const loadingScreen = document.getElementById('loading-screen');
        const mainContent = document.getElementById('contenido-principal');
        const favoritosFilterCheckbox = document.getElementById('favoritos-filter'); // NUEVO: Checkbox favoritos
        const accordionToggleButton = document.getElementById('accordion-toggle-button'); // NUEVO: Botón acordeón
        const accordionContent = document.getElementById('filtro-accordion-content-id'); // NUEVO: Contenido acordeón

        // --- CONSTANTES ---
        const DEBOUNCE_DELAY = 350; // ms para debounce
        const SKELETON_COUNT = 6; // Número de esqueletos a mostrar

        // --- FUNCIONES UTILITARIAS ---
        function debounce(func, delay) {
            let timeoutId;
            return function(...args) {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => { func.apply(this, args); }, delay);
            };
        }

        // --- LOCALSTORAGE (Filtros y Favoritos) ---
        function guardarFiltros() {
            try {
                const filtros = {
                    categoria: filtroCategoriaSeleccionada,
                    distancia: maxDistance,
                    busqueda: searchTerm,
                    soloFavoritos: mostrarSoloFavoritos // NUEVO: Guardar estado de favoritos
                };
                localStorage.setItem('enlazona_filtros', JSON.stringify(filtros));
            } catch (e) { console.error("Error guardando filtros:", e); }
        }

        function cargarFiltros() {
            try {
                const filtrosGuardados = localStorage.getItem('enlazona_filtros');
                if (filtrosGuardados) {
                    const filtros = JSON.parse(filtrosGuardados);
                    filtroCategoriaSeleccionada = filtros.categoria || 'Todos';
                    maxDistance = parseInt(filtros.distancia || 15, 10);
                    searchTerm = filtros.busqueda || '';
                    mostrarSoloFavoritos = filtros.soloFavoritos || false; // NUEVO: Cargar estado de favoritos

                    // Actualizar UI
                    if (filtroCategoriasSelect) filtroCategoriasSelect.value = filtroCategoriaSeleccionada;
                    if (distanceFilter) distanceFilter.value = maxDistance;
                    if (distanceValueSpan) distanceValueSpan.textContent = maxDistance;
                    if (buscadorInput) buscadorInput.value = searchTerm;
                    if (favoritosFilterCheckbox) favoritosFilterCheckbox.checked = mostrarSoloFavoritos; // NUEVO: Actualizar checkbox

                    console.log("Filtros cargados:", filtros);
                }
            } catch (e) { console.error("Error cargando filtros:", e); }
        }

        function guardarFavoritos() {
            try { localStorage.setItem('enlazona_favoritos', JSON.stringify(favoritos)); }
            catch (e) { console.error("Error guardando favoritos:", e); }
        }

        function cargarFavoritos() {
            try {
                const favoritosGuardados = localStorage.getItem('enlazona_favoritos');
                if (favoritosGuardados) { favoritos = JSON.parse(favoritosGuardados); }
                console.log("Favoritos cargados:", favoritos.length);
            } catch (e) { console.error("Error cargando favoritos:", e); favoritos = []; }
        }

        // --- SISTEMA DE FAVORITOS ---
        function esFavorito(itemId) { return favoritos.includes(itemId); }
        function agregarFavorito(itemId) {
            if (!esFavorito(itemId)) { favoritos.push(itemId); guardarFavoritos(); console.log(`Añadido favorito: ${itemId}`); return true; } return false;
        }
        function quitarFavorito(itemId) {
            if (esFavorito(itemId)) { favoritos = favoritos.filter(id => id !== itemId); guardarFavoritos(); console.log(`Quitado favorito: ${itemId}`); return true; } return false;
        }
        function toggleFavorito(itemId, iconElement) {
            // Limpiar el ID por si acaso tiene comillas
             const cleanItemId = itemId.replace(/\\'/g, "'");
            if (esFavorito(cleanItemId)) {
                quitarFavorito(cleanItemId);
                iconElement.classList.remove('favorited');
                iconElement.textContent = 'favorite_border';
                iconElement.setAttribute('aria-label', 'Marcar como favorito');
                iconElement.setAttribute('aria-pressed', 'false');
            } else {
                agregarFavorito(cleanItemId);
                iconElement.classList.add('favorited');
                iconElement.textContent = 'favorite';
                iconElement.setAttribute('aria-label', 'Quitar de favoritos');
                iconElement.setAttribute('aria-pressed', 'true');
            }
             // Si el filtro "Mostrar solo favoritos" está activo, volver a filtrar para reflejar el cambio
            if (mostrarSoloFavoritos) {
                filterAndDisplay();
            }
        }

        // --- FUNCIONALIDAD ACORDEÓN ---
        function toggleAccordion() {
            if (accordionContent && accordionToggleButton) {
                const isActive = accordionContent.classList.toggle('active');
                accordionToggleButton.classList.toggle('active', isActive);
                accordionToggleButton.setAttribute('aria-expanded', isActive ? 'true' : 'false');
                // Opcional: Guardar estado del acordeón en localStorage si se desea
                // localStorage.setItem('enlazona_accordion_open', isActive);
            }
        }
        function initAccordion() {
             // Opcional: Cargar estado del acordeón desde localStorage
            // const isOpen = localStorage.getItem('enlazona_accordion_open') === 'true';
            const isOpen = true; // Empezar abierto por defecto

            if (accordionContent && accordionToggleButton) {
                 accordionContent.classList.toggle('active', isOpen);
                 accordionToggleButton.classList.toggle('active', isOpen);
                 accordionToggleButton.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                 accordionToggleButton.addEventListener('click', toggleAccordion);
            }
        }


        // --- INICIALIZACIÓN PRINCIPAL ---
        async function init() {
            cargarFavoritos();
            cargarFiltros();
            initAccordion(); // NUEVO: Inicializar acordeón
            setupEventListeners();

            try {
                console.log("Iniciando carga de datos...");
                const [dataResponse, promosResponse] = await Promise.all([
                    fetch('data.json').catch(err => ({ ok: false, statusText: err.message, error: err })),
                    fetch('promos.json').catch(err => ({ ok: false, statusText: err.message, error: err }))
                ]);

                if (!dataResponse.ok) throw new Error(`Error al cargar data.json: ${dataResponse.statusText}`);
                allData = await dataResponse.json();

                if (!promosResponse.ok) { console.warn(`Advertencia promos.json: ${promosResponse.statusText}`); allPromos = []; }
                else { allPromos = await promosResponse.json(); }

                console.log("Datos JSON cargados:", allData.length, "lugares,", allPromos.length, "promos.");

                populateCategoryFilter();
                startPromoGallery();

                console.log("Intentando obtener ubicación...");
                await requestLocationAndFilter();

                console.log("Intento de ubicación completado.");
                hideLoadingScreenAndShowContent();

            } catch (error) {
                console.error("Error fatal inicialización:", error);
                showError(`No se pudo iniciar la aplicación: ${error.message}. Intenta recargar.`);
                hideLoadingScreenAndShowContent();
                distanceSliderUI?.classList.add('hidden');
                locationMessage?.classList.add('hidden');
            }
        }

        // --- OCULTAR LOADING SCREEN ---
        function hideLoadingScreenAndShowContent() {
             if (loadingScreen) {
                loadingScreen.style.opacity = '0';
                setTimeout(() => { loadingScreen.style.display = 'none'; }, 500);
            }
            if (mainContent) { mainContent.classList.add('visible'); }
            console.log("Pantalla de carga oculta.");
        }

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            // Slider distancia (debounce)
            if (distanceFilter) {
                distanceFilter.addEventListener('input', debounce(function() {
                    maxDistance = parseInt(this.value);
                    if (distanceValueSpan) distanceValueSpan.textContent = maxDistance;
                    if (!locationErrorOccurred) { guardarFiltros(); filterAndDisplay(); }
                }, DEBOUNCE_DELAY));
            }
            // Select categorías
            if (filtroCategoriasSelect) {
                filtroCategoriasSelect.addEventListener('change', () => {
                    filtroCategoriaSeleccionada = filtroCategoriasSelect.value;
                    guardarFiltros(); filterAndDisplay();
                });
            }
            // Input búsqueda (debounce)
            if (buscadorInput) {
                buscadorInput.addEventListener('input', debounce(() => {
                    searchTerm = buscadorInput.value.toLowerCase().trim();
                    guardarFiltros(); filterAndDisplay();
                }, DEBOUNCE_DELAY));
            }
            // NUEVO: Checkbox Favoritos
            if (favoritosFilterCheckbox) {
                favoritosFilterCheckbox.addEventListener('change', () => {
                    mostrarSoloFavoritos = favoritosFilterCheckbox.checked;
                    guardarFiltros(); // Guardar estado del filtro
                    filterAndDisplay();
                });
            }
            // Listener del acordeón ya se añade en initAccordion()
        }

        // --- GALERÍA PROMOCIONES --- (Sin cambios)
        function startPromoGallery() { /* ... código sin cambios ... */
             if (allPromos && allPromos.length > 0) {
                 if(loadingPromos) loadingPromos.classList.add('hidden');
                 showNextPromo();
                 if (promoIntervalId) clearInterval(promoIntervalId);
                 if (allPromos.length > 1) { promoIntervalId = setInterval(showNextPromo, 5000); }
             } else { if(loadingPromos) loadingPromos.textContent = 'No hay promociones disponibles.'; }
         }
         function showNextPromo() { /* ... código sin cambios ... */
             if (!promoGalleryDiv || !allPromos || allPromos.length === 0) return;
             let nextIndex;
             if (allPromos.length > 1) { do { nextIndex = Math.floor(Math.random() * allPromos.length); } while (nextIndex === currentPromoIndex); } else { nextIndex = 0; }
             currentPromoIndex = nextIndex; const promo = allPromos[currentPromoIndex];
             const promoLink = document.createElement('a'); promoLink.href = promo.link || '#'; promoLink.target = "_blank"; promoLink.rel = "noopener noreferrer"; promoLink.className = 'promo-item';
             const promoImg = document.createElement('img'); const placeholderPromoImg = `https://placehold.co/800x400/dddddd/aaaaaa?text=Promoción`;
             promoImg.src = promo.foto || placeholderPromoImg; promoImg.alt = `Promoción ${promo.name || ''}`; promoImg.onerror = function() { this.onerror = null; this.src = placeholderPromoImg; console.warn(`Failed to load promo image: ${promo.foto}`); };
             promoLink.appendChild(promoImg); const currentVisibleItem = promoGalleryDiv.querySelector('.promo-item.visible');
             promoGalleryDiv.appendChild(promoLink); requestAnimationFrame(() => { requestAnimationFrame(() => { promoLink.classList.add('visible'); }); });
             if (currentVisibleItem) { currentVisibleItem.classList.remove('visible'); setTimeout(() => { if (currentVisibleItem.parentNode === promoGalleryDiv) { promoGalleryDiv.removeChild(currentVisibleItem); } }, 500); }
         }

        // --- FILTRO CATEGORÍAS --- (Sin cambios)
        function populateCategoryFilter() { /* ... código sin cambios ... */
             if (!filtroCategoriasSelect || !allData) return;
            const categorias = ['Todos', ...new Set(allData.map(item => item.categoria).filter(Boolean))];
            filtroCategoriasSelect.innerHTML = '';
            categorias.forEach(categoria => {
                const option = document.createElement('option'); option.value = categoria; option.textContent = categoria;
                if(categoria === filtroCategoriaSeleccionada) { option.selected = true; }
                filtroCategoriasSelect.appendChild(option);
            });
        }

        // --- GEOLOCALIZACIÓN Y FILTRADO INICIAL ---
        function requestLocationAndFilter() { /* ... código sin cambios, renderSkeletons ya está aquí ... */
            return new Promise((resolve) => {
                if (distanceSliderUI) distanceSliderUI.classList.add('hidden'); if (locationMessage) locationMessage.classList.add('hidden');
                if (loadingMessage) loadingMessage.textContent = "Obteniendo ubicación..."; hideMessages(); renderSkeletons(SKELETON_COUNT);
                if (navigator.geolocation && navigator.geolocation.getCurrentPosition) {
                    console.log("Solicitando ubicación...");
                    navigator.geolocation.getCurrentPosition( (position) => { handleLocationSuccess(position); resolve(); }, (error) => { handleLocationError(error); resolve(); }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 } );
                } else { console.log('Geolocalización no compatible.'); handleLocationError({ code: -1, message: 'Geolocalización no compatible.' }); resolve(); }
            });
         }
        function handleLocationSuccess(position) { /* ... código sin cambios ... */
            userLat = position.coords.latitude; userLon = position.coords.longitude; locationErrorOccurred = false;
            console.log(`Ubicación obtenida: ${userLat}, ${userLon}`);
            if (distanceSliderUI) distanceSliderUI.classList.remove('hidden'); if (locationMessage) locationMessage.classList.add('hidden');
            filterAndDisplay();
        }
        function handleLocationError(error) { /* ... código sin cambios ... */
            console.warn('Error ubicación:', error.message, `(Código: ${error.code})`);
            userLat = undefined; userLon = undefined; locationErrorOccurred = true;
            if (distanceSliderUI) distanceSliderUI.classList.add('hidden'); if (locationMessage) locationMessage.classList.remove('hidden');
            if (error.code === 1) { console.warn('Permiso denegado.'); if(locationMessage) locationMessage.textContent = "Permiso denegado. Activa la ubicación para filtrar por distancia."; }
            else { if(locationMessage) locationMessage.textContent = "No se pudo obtener ubicación. Mostrando todos los lugares."; console.log("Mostrando sin filtro distancia."); }
            filterAndDisplay();
        }

        // --- CÁLCULO DISTANCIA (Haversine) --- (Sin cambios)
        function calculateDistance(lat1, lon1, lat2, lon2) { /* ... código sin cambios ... */
            if (userLat === undefined || userLon === undefined || lat2 === undefined || lon2 === undefined || lat2 === null || lon2 === null) { return Infinity; }
            const R = 6371; const dLat = deg2rad(lat2 - lat1); const dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); return R * c;
         }
        function deg2rad(deg) { return deg * (Math.PI / 180); }

        // --- BARAJAR ARRAY (Fisher-Yates) --- (Sin cambios)
        function shuffleArray(array) { /* ... código sin cambios ... */
             const shuffledArray = [...array];
            for (let i = shuffledArray.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffledArray[i], shuffledArray[j]] = [shuffledArray[j], shuffledArray[i]]; }
            return shuffledArray;
        }

        // --- RENDERIZADO DE ESQUELETOS --- (Sin cambios)
        function renderSkeletons(count) { /* ... código sin cambios ... */
             if (!dataListDiv) return; dataListDiv.innerHTML = ''; hideMessages(); loadingMessage.classList.remove('hidden'); loadingMessage.textContent = 'Cargando lugares...';
            for (let i = 0; i < count; i++) {
                const skeletonDiv = document.createElement('div'); skeletonDiv.className = 'skeleton-card'; skeletonDiv.setAttribute('aria-hidden', 'true');
                skeletonDiv.innerHTML = `<div class="skeleton-image"></div><div class="skeleton-content"><div class="skeleton-text"></div><div class="skeleton-text short"></div><div class="skeleton-text medium"></div><div class="skeleton-text"></div><div class="skeleton-tags"><div class="skeleton-tag"></div><div class="skeleton-tag"></div><div class="skeleton-tag"></div></div></div>`;
                dataListDiv.appendChild(skeletonDiv);
            }
        }


        // --- FILTRADO Y VISUALIZACIÓN (MODIFICADO para filtro favoritos) ---
        function filterAndDisplay() {
            if (!allData) { console.warn("Filtrando pero allData no está listo."); return; }

             if (userLat === undefined && userLon === undefined && !locationErrorOccurred) { renderSkeletons(SKELETON_COUNT); }
             else { hideMessages(); loadingMessage.classList.remove('hidden'); loadingMessage.textContent = "Filtrando y ordenando..."; }

            setTimeout(() => {
                try {
                    // 0. Determinar el conjunto de datos inicial (todos o solo favoritos)
                    let initialDataSet = allData;
                    if (mostrarSoloFavoritos) {
                        console.log("Filtrando solo favoritos...");
                        initialDataSet = allData.filter(item => esFavorito(item.name)); // Asumiendo 'name' es ID
                         console.log(`Encontrados ${initialDataSet.length} favoritos.`);
                    }

                    // 1. Filtrar el conjunto de datos inicial
                    let filteredData = initialDataSet.filter(item => {
                        let distanciaCumple = true;
                        if (!locationErrorOccurred && userLat !== undefined && userLon !== undefined) {
                            const distancia = calculateDistance(userLat, userLon, item.latitud, item.longitud);
                            distanciaCumple = (distancia <= maxDistance);
                        }
                        const categoriaCoincide = (filtroCategoriaSeleccionada === 'Todos') || (item.categoria === filtroCategoriaSeleccionada);
                        const busquedaCoincide = (searchTerm === '') ||
                            (item.name && item.name.toLowerCase().includes(searchTerm)) ||
                            (item.etiquetas && Array.isArray(item.etiquetas) && item.etiquetas.some(et => et.toLowerCase().includes(searchTerm)));
                        return distanciaCumple && categoriaCoincide && busquedaCoincide;
                    });

                    // 2. Barajar datos filtrados (si no son favoritos, para mantener aleatoriedad)
                    // Si son favoritos, quizás prefieras ordenarlos por nombre o no barajar
                    if (!mostrarSoloFavoritos) {
                         console.log(`Filtrados ${filteredData.length} items (aleatorio). Barajando...`);
                         filteredData = shuffleArray(filteredData);
                    } else {
                         console.log(`Filtrados ${filteredData.length} items (favoritos).`);
                         // Opcional: Ordenar favoritos alfabéticamente
                         // filteredData.sort((a, b) => a.name.localeCompare(b.name));
                    }


                    // 3. Renderizar datos
                    renderData(filteredData);

                } catch (filterRenderError) {
                    console.error("Error filtrando/renderizando:", filterRenderError);
                    showError("Ocurrió un error al mostrar los lugares.");
                } finally {
                     loadingMessage.classList.add('hidden');
                }
            }, 10);
        }

        // --- RENDERIZADO DATOS (MODIFICADO para limpiar ID en toggleFavorito) ---
        function renderData(items) {
            if (!dataListDiv) return;
            dataListDiv.innerHTML = ''; // Limpiar
            hideMessages();

            if (items.length > 0) {
                items.forEach((item, index) => {
                    try {
                        const itemDiv = document.createElement('article');
                        itemDiv.className = 'data-card';
                        itemDiv.style.animationDelay = `${index * 0.06}s`;
                        itemDiv.setAttribute('aria-labelledby', `card-title-${index}`);

                        let distanciaTexto = '';
                        if (!locationErrorOccurred && userLat !== undefined && userLon !== undefined) {
                            const distanciaKm = calculateDistance(userLat, userLon, item.latitud, item.longitud);
                            if (isFinite(distanciaKm)) { distanciaTexto = ` (~${distanciaKm.toFixed(1)} km)`; }
                        }

                        const placeholderImg = `https://placehold.co/300x200/eeeeee/cccccc?text=Imagen+no+disponible`;
                        // Asegurarse que el ID no tenga caracteres problemáticos para JS inline
                        const itemId = item.name || `item-${index}`; // Usar nombre o fallback
                        const safeItemId = itemId.replace(/'/g, "\\'").replace(/"/g, '\\"'); // Escapar comillas
                        const isFav = esFavorito(itemId); // Usar el ID original para buscar en favoritos

                        itemDiv.innerHTML = `
                            <span
                                class="favorite-icon material-symbols-outlined ${isFav ? 'favorited' : ''}"
                                role="button" tabindex="0"
                                aria-pressed="${isFav ? 'true' : 'false'}"
                                aria-label="${isFav ? 'Quitar de favoritos' : 'Marcar como favorito'}"
                                data-item-id="${itemId}"
                                onclick="event.stopPropagation(); toggleFavorito('${safeItemId}', this)"
                                onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); event.stopPropagation(); toggleFavorito('${safeItemId}', this); }"
                            >
                                ${isFav ? 'favorite' : 'favorite_border'}
                            </span>
                            <img src="${item.imagen || placeholderImg}" alt="" class="card-image" onerror="this.onerror=null; this.src='${placeholderImg}';" aria-hidden="true">
                            <div class="card-content">
                                <h3 class="card-title" id="card-title-${index}">${item.name || 'Nombre no disponible'}</h3>
                                <p class="card-category">${item.categoria || 'Categoría no disponible'}<span class="card-distance">${distanciaTexto}</span></p>
                                <p class="card-description">${item.descripcion || 'Descripción no disponible.'}</p>
                                ${item.etiquetas && Array.isArray(item.etiquetas) && item.etiquetas.length > 0
                                    ? `<div class="card-tags" aria-label="Etiquetas">
                                        ${item.etiquetas.map(tag =>
                                            `<button class="card-tag" data-tag="${tag}" aria-label="Filtrar por etiqueta: ${tag}">${tag}</button>`
                                        ).join('')}
                                       </div>`
                                    : ''
                                }
                            </div>
                        `;

                        // Listener para navegar a detalles
                        itemDiv.addEventListener('click', () => { /* ... código sin cambios ... */
                            try {
                                const params = new URLSearchParams();
                                for (const key in item) { if (Object.hasOwnProperty.call(item, key) && item[key] !== undefined && item[key] !== null) { const value = Array.isArray(item[key]) ? item[key].join(',') : String(item[key]); params.append(key, value); } }
                                if (!params.has('latitud')) params.append('latitud', ''); if (!params.has('longitud')) params.append('longitud', '');
                                const urlDestino = `detalles.html?${params.toString()}`; console.log("Navegando a:", urlDestino); window.location.href = urlDestino;
                            } catch (navError) { console.error("Error navegación:", navError, "Item:", item); alert("No se pudo abrir el detalle."); }
                        });

                        // Listeners para etiquetas clickables
                        itemDiv.querySelectorAll('.card-tag').forEach(tagButton => { /* ... código sin cambios ... */
                            tagButton.addEventListener('click', (e) => {
                                e.stopPropagation(); const tag = tagButton.dataset.tag;
                                if (tag && buscadorInput) { buscadorInput.value = tag; searchTerm = tag.toLowerCase().trim(); guardarFiltros(); filterAndDisplay(); buscadorInput.focus(); }
                            });
                        });

                        dataListDiv.appendChild(itemDiv);

                    } catch (itemError) { console.error("Error renderizando item:", item, itemError); }
                });
            } else { showNoResults(); }
        }

        // --- MENSAJES (Modificado showNoResults) ---
        function showError(message) { /* ... código sin cambios ... */
             if (errorMessage) { errorMessage.textContent = message; errorMessage.classList.remove('hidden'); }
            dataListDiv.innerHTML = ''; loadingMessage.classList.add('hidden'); noResultsMessage.classList.add('hidden');
        }
        function showNoResults() {
            if (noResultsMessage) {
                 let baseMessage = mostrarSoloFavoritos
                    ? 'No tienes lugares favoritos que coincidan.'
                    : 'No se encontraron lugares que coincidan.';
                 let suggestions = '<span>Intenta con otros filtros:</span>';

                 // Sugerencias si NO estamos filtrando solo por favoritos
                 if (!mostrarSoloFavoritos) {
                     if (searchTerm) { suggestions += `<span>- Revisa si '${searchTerm}' está bien escrito.</span>`; }
                     if (filtroCategoriaSeleccionada !== 'Todos') { suggestions += `<span>- Prueba seleccionando 'Todas' las categorías.</span>`; }
                     if (!locationErrorOccurred && maxDistance < 50) { suggestions += `<span>- Amplía la distancia de búsqueda.</span>`; }
                     else if (locationErrorOccurred) { suggestions += `<span>- Activa la ubicación para filtrar por distancia.</span>`; }
                 } else {
                     // Sugerencias si SÍ estamos filtrando por favoritos
                     suggestions = '<span>Puedes:</span>';
                     suggestions += `<span>- Desactiva el filtro "Mostrar solo favoritos" para ver todos los lugares.</span>`;
                      if (searchTerm) { suggestions += `<span>- Quita el término de búsqueda '${searchTerm}'.</span>`; }
                 }


                noResultsMessage.innerHTML = `${baseMessage}<br>${suggestions}`;
                noResultsMessage.classList.remove('hidden');
            }
             dataListDiv.innerHTML = ''; // Asegurar lista vacía
            loadingMessage.classList.add('hidden');
            errorMessage.classList.add('hidden');
        }
        function hideMessages() { /* ... código sin cambios ... */
             if (errorMessage) errorMessage.classList.add('hidden'); if (noResultsMessage) noResultsMessage.classList.add('hidden');
        }

        // --- INICIAR ---
        document.addEventListener('DOMContentLoaded', init);

        /* --- NOTAS DE OPTIMIZACIÓN DE IMÁGENES --- */
        /* ... código sin cambios ... */

    </script>
</body>
</html>
